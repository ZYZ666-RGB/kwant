# Throwaway (33s, Lin): runs tests/team_stop_test.rs RUNS times on this branch. Lives only on
# lin-33s-loop-* branches, never merges; the branches are deleted after.
name: lin-33s-loop
on:
  push:
    branches: ['lin-33s-loop-*']
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-latest
    env:
      KWNT_TEST_REQUIRE: "1"
      RUNS: "50"
      EXPECT: green
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p frontend/dist && echo '<!doctype html><title>kwnt</title>' > frontend/dist/index.html
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo test --locked --test team_stop_test --no-run
      - name: Loop
        run: |
          bin=$(cargo test --locked --test team_stop_test --no-run --message-format=json 2>/dev/null | jq -r 'select(.executable != null and .target.name=="team_stop_test") | .executable')
          echo "binary: $bin"; fails=0
          mkdir -p runs
          for i in $(seq 1 "$RUNS"); do
            if "$bin" > "runs/$i.log" 2>&1; then echo "run $i: ok"; else fails=$((fails+1)); echo "run $i: FAILED"; grep -E "\.\.\. FAILED|panicked|left:|right:" "runs/$i.log" | head -12; fi
          done
          { echo "## team_stop_test x $RUNS on ${GITHUB_SHA::8}: $fails run(s) failed"; echo; echo '| test | ok | FAILED |'; echo '|---|---|---|';
            cat runs/*.log | sed -n 's/^test \([a-z0-9_]*\) \.\.\. \(ok\|FAILED\)$/\1 \2/p' | sort | uniq -c | awk '{c[$2" "$3]=$1; t[$2]=1} END {for (k in t) printf "| %s | %d | %d |\n", k, c[k" ok"], c[k" FAILED"]}'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EXPECT" = green ] && [ "$fails" -gt 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs
          path: runs/
          retention-days: 7
